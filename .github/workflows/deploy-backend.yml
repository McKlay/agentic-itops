name: Deploy Backend

on:
  push:
    branches: [main]
    paths: ["backend/**"]
  workflow_dispatch:          # allow manual trigger

env:
  PYTHON_VERSION: "3.11"
  APP_SERVICE_NAME: app-ai-ops-agent   # update when App Service is provisioned

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run tests
        run: pytest tests/ -v

  deploy:
    name: Deploy to Azure App Service
    runs-on: ubuntu-latest
    needs: test
    environment: production
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: pip install -e .

      # TODO: Uncomment and configure once App Service is provisioned (Phase 10.2)
