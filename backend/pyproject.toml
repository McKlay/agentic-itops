[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "falcon-ai-ops-agent"
version = "0.1.0"
description = "AI Operations Concierge — approval-first enterprise IT operations platform"
requires-python = ">=3.11"
readme = "README.md"
license = { text = "Internal Use" }
authors = [{ name = "CM Sarte", email = "cm.sarte@dxc.com" }]

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
    "openai>=1.30",
    "azure-search-documents>=11.6",
    "azure-storage-blob>=12.20",
    "langgraph>=0.2",
    "langchain-core>=0.3",
    "python-jose[cryptography]>=3.3",
]

[project.optional-dependencies]
redis = [
    "redis>=5.0",
]
cosmos = [
    "azure-cosmos>=4.7",
]
table = [
    "azure-data-tables>=12.5",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",       # TestClient transport
    "ruff>=0.4",
    "mypy>=1.10",
]
all = [
    "falcon-ai-ops-agent[redis,cosmos,table,dev]",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
